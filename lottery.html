<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>当選番号発表｜焼き鳥 ブエノストリデス</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 1画面ずつスワイプで送る */
    html { scroll-snap-type: y mandatory; }
    body { background: var(--sumi); }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      background: var(--noren);
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
    }
    .topbar a { text-decoration: none; }

    .slide {
      scroll-snap-align: start;
      min-height: 100svh;
      padding: 64px 20px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      background: var(--kinari);
      border-bottom: 1px solid #e3d7bf;
    }
    .slide h1, .slide h2 {
      font-family: var(--font-heading);
      font-weight: 900;
      margin: 0;
      border: none;
      padding: 0;
    }

    /* 表紙 */
    .cover { background: var(--noren); color: #fff; }
    .cover .round { font-size: 1rem; letter-spacing: 0.2em; opacity: 0.9; }
    .cover h1 { font-size: clamp(2.2rem, 11vw, 3.4rem); line-height: 1.2; margin: 8px 0 16px; }
    .cover .date {
      border: 1px solid rgba(255,255,255,0.6);
      padding: 4px 14px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .cover .lead { margin-top: 24px; font-size: 0.95rem; }

    /* 等級ごとのスライド */
    .rank {
      font-family: var(--font-display);
      font-size: clamp(3.4rem, 18vw, 5rem);
      line-height: 1;
      color: var(--noren);
    }
    .prize {
      margin: 10px 0 20px;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .cond {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .numbers { display: grid; gap: 10px; }

    /* 5桁の番号表示：照合しない桁は「－」で薄く出す */
    .num { display: flex; gap: 6px; justify-content: center; }
    .num span {
      width: 2.1em;
      height: 2.6em;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 6vw, 1.6rem);
      border-radius: 6px;
      background: #fff;
      border: 2px solid var(--wood);
    }
    .num span.skip {
      background: transparent;
      border-style: dashed;
      border-color: #c9bca6;
      color: #c9bca6;
    }
    .rank-1 .num span:not(.skip) { background: var(--gold); border-color: var(--noren-dark); }

    /* 1等の発表演出 */
    .rank-1 { background: var(--sumi); color: #fff; }
    .rank-1 .cond { color: #cfc6bb; }
    .rank-1 .prize { color: var(--gold); }
    .reveal-btn {
      margin-top: 20px;
      font-size: 1.05rem;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .teaser { font-size: 1.1rem; margin: 16px 0 0; }
    .congrats {
      margin-top: 20px;
      font-weight: bold;
      color: var(--gold);
      opacity: 0;
      transition: opacity 0.6s;
    }
    .congrats.show { opacity: 1; }

    /* 締め */
    .closing h2 { font-size: 1.6rem; margin-bottom: 16px; }
    .closing .board { text-align: left; max-width: 420px; font-size: 0.9rem; }
    .closing ul { margin: 0; padding-left: 1.2em; }
    .closing .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 24px; }

    /* スワイプの誘導矢印 */
    .hint {
      position: absolute;
      bottom: 16px;
      font-size: 0.8rem;
      opacity: 0.6;
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(6px); } }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">焼き鳥 ブエノストリデス</a>
    <span>第77回駒場祭</span>
  </div>

  <!-- スライドは js/lottery.js が当選番号の設定から生成する -->
  <div id="slides"></div>

  <script src="js/lottery.js"></script>
</body>
</html>
